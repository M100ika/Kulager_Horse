; Стендовый тест CubeMars AK80-64: Arduino Mega 2560 + MCP2515 (CAN по SPI).
;
;   pio test -e native                 тесты протокола на ПК, железо не нужно
;   pio test -e mega -f test_motor -v  проверка мотора на стенде
;   pio test -e mega                   тесты протокола и мотора на Mega
;   pio run -e mega -t upload -t monitor  интерактивная консоль (src/main.cpp)
;
; Подключение и порядок проверки: README.md

[platformio]
default_envs = mega

[env:native]
platform = native
test_filter = test_protocol
build_flags = -Wall -Wextra

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = autowp/autowp-mcp2515@^1.3.1
test_speed = 115200
monitor_speed = 115200
; консоль src/main.cpp: строка уходит по Enter, ввод виден в терминале
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF
build_flags = -Wall
